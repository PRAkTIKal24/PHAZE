name: Run Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Sync dependencies with uv
        run: |
          uv sync --group test --group dev
        continue-on-error: false

      - name: Install package in editable mode
        run: |
          uv pip install -e .
        continue-on-error: false

      - name: Verify installation
        run: |
          uv run python -c "import phaze; print(f'PHAZE version: {phaze.__version__}')"

      - name: Run ruff linting with auto-fix
        run: |
          uv run ruff check --fix --exit-zero .
        continue-on-error: true

      - name: Run ruff formatting
        run: |
          uv run ruff format .
        continue-on-error: true

      - name: Check for formatting changes
        id: format-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Ruff made formatting changes"
            git diff --name-only
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed"
          fi
        continue-on-error: true

      - name: Check for any remaining ruff issues
        run: |
          uv run ruff check .
        continue-on-error: false

      - name: Run tests with coverage
        run: |
          uv run pytest --tb=short --cov=phaze --cov-report=xml --cov-report=term -v --maxfail=10
        continue-on-error: false

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Create test summary
        if: always()
        run: |
          echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY  
          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.format-changes.outputs.changes }}" = "true" ]; then
            echo "- **Linting**: ✨ Ruff auto-fix applied with formatting changes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Linting**: ✅ Ruff checks passed, no formatting needed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f coverage.xml ]; then
            echo "- **Coverage**: Available in coverage.xml" >> $GITHUB_STEP_SUMMARY
          fi
