[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaze"
version = "0.3.2"
description = "A Python package for PHAZE: cryptographic and ZKML-based low latency inference at LHC"
authors = [{ name = "Pratik Jawahar", email = "pratik.jawahar@cern.ch" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "uv",
    "onnx",
    "onnxruntime",
    "ezkl",
    "scikit-learn",
    "torchvision",
    "tqdm",
    "rich",
    "art",
    "loky",
    "h5py",
    "matplotlib",
    "argparse",
    "dask",
    "numba",
    "setuptools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "sphinx",
    "sphinx_rtd_theme",
    "myst-parser",
    "ruff",
]
viz = ["umap-learn>=0.5.5"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-xdist>=3.5.0"]

[project.scripts]
phaze = "phaze.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=phaze --cov-report=xml --cov-report=term"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.hatch.build.targets.sdist]
include = ["/phaze", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel.sources]
"phaze" = "phaze"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
