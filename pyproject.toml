[project]
name = "phaze"
version = "0.3.2"
description = "A Python package for PHAZE: cryptographic and ZKML-based low latency inference at LHC"
authors = [{ name = "Pratik Jawahar", email = "pratik.jawahar@cern.ch" }]
dependencies = ["torch", "numpy", "scipy", "uv", "onnx", "onnxruntime", "ezkl"]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "sphinx",
    "sphinx_rtd_theme",
    "myst-parser",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
