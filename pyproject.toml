[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "phaze"
version = "0.7.3"
description = "A Python package for PHAZE: cryptographic and ZKML-based low latency inference at LHC"
authors = [{ name = "Pratik Jawahar", email = "pratik.jawahar@cern.ch" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "uv",
    "onnx",
    "onnxruntime",
    "ezkl",
    "scikit-learn",
    "torchvision",
    "tqdm",
    "rich",
    "art",
    "loky",
    "h5py",
    "matplotlib",
    "argparse",
    "dask",
    "numba",
    "setuptools",
    "pandas>=2.3.2",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "sphinx",
    "sphinx_rtd_theme",
    "myst-parser",
    "ruff",
]

test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
]

[dependency-groups]
dev = [
    "wrapt>=1.17.2,<2",
    "sphinx>=8.1.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.13",
]

test = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=5.0.0,<6",
]

test-fast = [
    "pytest>=8.0.0,<9", 
    "pytest-cov>=5.0.0,<6",
]

ci = [
    # Core dependencies needed for CI tests
    "torch",
    "numpy", 
    "pandas>=2.3.2",
    "psutil",
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<6", 
]

[project.scripts]
phaze = "phaze.phaze:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "--cov=phaze --cov-report=xml --cov-report=term"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.hatch.build.targets.sdist]
include = ["/phaze", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["phaze"]

[tool.maturin]
# Configure maturin to build the Rust extension
module-name = "rust_zkml_bindings"
# Path to the Rust project
manifest-path = "rust_bindings/Cargo.toml"
# Include Python sources from phaze directory
python-source = "phaze"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
