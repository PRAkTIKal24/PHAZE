[build-system]
requires = ["maturin>=1.0,<2.0", "setuptools"]
build-backend = "maturin"

[project]
name = "phaze"
version = "0.14.4"
description = "A Python package for PHAZE: cryptographic and ZKML-based low latency inference at LHC"
authors = [{ name = "Pratik Jawahar", email = "pratik.jawahar@cern.ch" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "maturin",
    "torch==2.5.0",  # Working version from October when EZKL was functional
    "numpy",
    "scipy",
    "uv",
    "onnx>=1.15.0,<1.17.0",
    "onnxruntime>=1.18.0,<1.20.0",
    "onnxscript>=0.1.0",
    "ezkl",
    "scikit-learn",
    "torchvision==0.20.0",  # Compatible with torch 2.5.0
    "tqdm",
    "rich",
    "art",
    "loky",
    "h5py",
    "matplotlib",
    "argparse",
    "dask",
    "numba",
    "setuptools",
    "pandas>=2.3.2",
    "psutil",
]

[dependency-groups]
dev = [
    "wrapt>=1.17.2,<2",
    "sphinx>=8.1.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "myst-parser>=4.0.0,<5",
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.13",
]

test = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0,<6",
]

test-fast = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<6",
]

ci = [
    # Core dependencies needed for CI tests
    "torch==2.5.0",  # Working version from October when EZKL was functional
    "numpy",
    "pandas>=2.3.2",
    "psutil",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0,<6",
]

[project.scripts]
phaze = "phaze.phaze:main"
phaze-legacy = "phaze.phaze_legacy:main"
phaze-risc-build = "phaze_risc_build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "--cov=phaze --cov-report=xml --cov-report=term"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Temporarily ignore line length for plotting files during development
extend-ignore = ["E501"]

[tool.maturin]
# Configure maturin to build the Rust extension
module-name = "rust_zkml_bindings"
# Path to the Rust project
manifest-path = "rust_bindings/Cargo.toml"
# Include Python sources from phaze directory
python-source = "phaze"
# Build features for RISC Zero
features = ["pyo3/extension-module"]
# Release builds by default for better performance
release = true

[tool.uv.sources]
torch = [
#     { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
#     { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu" },
]
torchvision = [
#     { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
#     { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
