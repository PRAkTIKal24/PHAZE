[package]
name = "rust_zkml_bindings"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_zkml_bindings"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
sha2 = "0.10"
hex = "0.4"
tiny-keccak = { version = "2.0.2", features = ["sha3", "keccak"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
num-bigint = "0.4"
num-traits = "0.2"
bincode = "1.3"
chrono = "0.4"

# RISC Zero dependencies - now enabled for full implementation
risc0-zkvm = { version = "2.0.2", features = ["prove", "verify"] }

[build-dependencies]
pyo3-build-config = "0.20"
