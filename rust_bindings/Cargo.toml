[package]
name = "rust_zkml_bindings"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_zkml_bindings"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
sha2 = "0.10"
hex = "0.4"
tiny-keccak = { version = "2.0.2", features = ["sha3", "keccak"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
num-bigint = "0.4"
num-traits = "0.2"

# zkML-related dependencies (placeholders for now)
# These would be actual zkML framework dependencies in a real implementation
# ark-std = "0.4"
# ark-ff = "0.4"
# ark-ec = "0.4"
# ark-poly = "0.4"
# ark-serialize = "0.4"

[build-dependencies]
pyo3-build-config = "0.20"

